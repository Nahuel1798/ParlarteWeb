spring.application.name=parlarte

spring.datasource.url=jdbc:postgresql://localhost:5432/italiano_db
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=bQilXPA6RfDOlqFivR17EbD/IGfN7WEzxe4FjDqc4EG10vYaJ8N+R9ZYWdAK2CuD
# El access token es de vida corta (15 min) y se renueva con el refresh token.
app.jwt.expiration=900000
# El refresh token dura 7 dias.
app.jwt.refresh-expiration=604800000

# Cookies httpOnly con los tokens. En produccion sobre HTTPS usar
# app.cookies.secure=true y app.cookies.same-site=None si el front y el back
# viven en dominios distintos.
app.cookies.access-name=parlarte_access
app.cookies.refresh-name=parlarte_refresh
app.cookies.secure=false
app.cookies.same-site=Lax

app.uploads.dir=${user.dir}/uploads

# 500MB para permitir la subida de videos MP4. El limite anterior de 5MB
# solo daba para imagenes de portada.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Los videos llegan en un solo request multipart. El limite de 20s que trae
# Tomcat por defecto para la conexion es justo para archivos grandes.
server.tomcat.connection-timeout=60000